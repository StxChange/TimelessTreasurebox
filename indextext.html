<style>

body {

    margin: 0;

    color: rgb(216, 185, 83);

    display: flex;

    background: black;

    align-items: center;

    justify-content: center;

    height: 100vh;

    font-family: "Roboto Flex", system-ui, sans-serif;

    font-size: 10vw;

}

 

.stx-animate-text {

    letter-spacing: -0.18em;

    text-shadow: -3px 1px 0 #000;

}

 

/* Use font-weight instead of font-variation-settings */

@keyframes stx-breathe {

    0%, 100% { font-weight: 1000; }

    50%      { font-weight: 100; }

}

 

.stx-animate-text span {

    display: inline-block; /* needed for transforms/animations */

    animation: stx-breathe 4s ease-in-out infinite;

    animation-delay: calc(var(--index) * 0.4s);

    font-weight: 100; /* starting value */

}

</style>
